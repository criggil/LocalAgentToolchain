[package]
name = "skill"
version = "0.1.0"
edition = "2021"
description = "Universal AI Agent Skill Manager for Claude, Codex, Antigravity, Pi, and Junie"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
colored = "2.1"
tabled = { version = "0.17", features = ["ansi"] }
walkdir = "2.5"
tracker-core = { path = "../core" }

[package]
name = "task"
version = "0.1.0"
edition = "2021"
description = "A fast, agent-friendly Markdown CLI task manager"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
tabled = { version = "0.17", features = ["ansi"] }
walkdir = "2.5"
tempfile = "3.10"
tracker-core = { path = "../core" }

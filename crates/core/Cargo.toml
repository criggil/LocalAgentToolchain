[package]
name = "tracker-core"
version = "0.1.0"
edition = "2021"
description = "Core workspace context, registry, and path resolution engine"

[lib]
name = "tracker_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

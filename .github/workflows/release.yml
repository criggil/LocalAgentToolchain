name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: local-agent-toolchain-aarch64-apple-darwin.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: local-agent-toolchain-x86_64-apple-darwin.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: local-agent-toolchain-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        run: |
          mkdir -p dist
          BIN_DIR="target/${{ matrix.target }}/release"
          tar -czf dist/${{ matrix.artifact_name }} \
            -C "$BIN_DIR" task note skill \
            -C "$GITHUB_WORKSPACE" README.md

          cd dist
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
